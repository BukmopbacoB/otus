      #     id: split_request
      #     source: >
      #       function process(event) {
      #         var req = event.Get("nginx.access.request");
      #         if (!req) return;
      #         var parts = req.split(" ");
      #         if (parts.length >= 3) {
      #           event.Put("http.request.method", parts[0]);
      #           event.Put("url.original", parts[1]);
      #           event.Put("http.version", parts[2]);
      #         }
      #       }
      # - convert:
      #     fields:
      #       - {from: "status", to: "http.response.status_code", type: "long", ignore_missing: true}
      #       - {from: "body_bytes_sent", to: "http.response.body.bytes", type: "long", ignore_missing: true}
      #     fail_on_error: false
      #     ignore_missing: true
      # - rename:
      #     fields:
      #       - from: remote_addr
      #         to: source.address
      #       - from: http_referer
      #         to: http.request.referrer
      #       - from: http_user_agent
      #         to: user_agent.original
      #     ignore_missing: true
      #     fail_on_error: false

processors:
  - add_host_metadata: ~
  - add_docker_metadata: ~

output.elasticsearch:
  hosts: ["${ELASTIC_HOSTS:http://elasticsearch:9200}"]
  username: "${ELASTIC_USERNAME:elastic}"
  password: "${ELASTIC_PASSWORD}"
  indices:
    - index: "logs-nginx-%{+yyyy.MM.dd}"
      when.equals:
        log_type: nginx_access
    - index: "logs-phpfpm-%{+yyyy.MM.dd}"
      when.equals:
        log_type: php-fpm
    - index: "logs-postgresql-%{+yyyy.MM.dd}"
      when.equals:
        event.module: postgresql
