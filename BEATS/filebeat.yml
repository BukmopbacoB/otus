setup.ilm.enabled: false
setup.template.enabled: true
setup.template.name: "beats-logs"
setup.template.pattern: "logs-*"
# setup.kibana:
#   host: "${KIBANA_HOST:http://kibana:5601}"

filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

filebeat.inputs:
  - type: log
    # id: php-fpm-log
    enabled: true
    paths:
      - /logs/php-fpm/*.log
    # ignore_older: 0
    fields:
      service_name: php-fpm
      log_type: php-fpm
    fields_under_root: true
    # parsers:
    #   - multiline:
    #       type: pattern
    #       pattern: '^\[[0-9]{2}-[A-Za-z]{3}-[0-9]{4}'
    #       negate: true
    #       match: after

  - type: log
    # id: nginx-access-dissect
    enabled: true
    paths:
      - /logs/nginx/access.log
    ignore_older: 0
    fields:
      service_name: nginx
      log_type: nginx_access
    fields_under_root: true
    processors:
      - dissect:
          tokenizer: '%{remote_addr} - %{remote_user} [%{time_local}] "%{request}" %{status} %{body_bytes_sent} "%{http_referer}" "%{http_user_agent}"'
          field: message
          target_prefix: nginx.access
