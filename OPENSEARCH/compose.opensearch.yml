name: opensearch-logging

services:
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
      - plugins.security.disabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    restart: unless-stopped
    networks:
      - cms-shared-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.14.0
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-AdminPassword123!}
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=false
    depends_on:
      - opensearch
    ports:
      - "5601:5601"
    restart: unless-stopped
    networks:
      - cms-shared-net

  data-prepper:
    image: opensearchproject/data-prepper:2.7.0
    environment:
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-AdminPassword123!}
    volumes:
      - ./data-prepper/pipelines.yaml:/usr/share/data-prepper/pipelines/pipelines.yaml:ro
      - ./data-prepper/data-prepper-config.yaml:/usr/share/data-prepper/config/data-prepper-config.yaml:ro
    depends_on:
      - opensearch
    ports:
      - "2021:2021"
    restart: unless-stopped
    networks:
      - cms-shared-net

  fluent-bit:
    image: fluent/fluent-bit:3.0
    user: root
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./logs/nginx:/logs/nginx:ro
      - ./logs/php-fpm:/logs/php-fpm:ro
      - ./logs/postgresql:/logs/postgresql:ro
    depends_on:
      - data-prepper
    restart: unless-stopped
    networks:
      - cms-shared-net

networks:
  cms-shared-net:
    external: true

volumes:
  opensearch-data:
