[SERVICE]
    Flush       5
    Daemon      Off
    Log_Level   info
    HTTP_Server Off

[INPUT]
    Name              tail
    Path              /logs/nginx/*.log
    Path_Key          file
    Tag               nginx.*
    Read_From_Head    On
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Buffer_Chunk_Size 32k
    Buffer_Max_Size   64k

[INPUT]
    Name              tail
    Path              /logs/php-fpm/*.log
    Path_Key          file
    Tag               php-fpm.*
    Read_From_Head    On
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Buffer_Chunk_Size 32k
    Buffer_Max_Size   64k

[INPUT]
    Name              tail
    Path              /logs/postgresql/*.log
    Path_Key          file
    Tag               postgresql.*
    Read_From_Head    On
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Buffer_Chunk_Size 32k
    Buffer_Max_Size   64k

[OUTPUT]
    Name              http
    Match             *
    Host              data-prepper
    Port              2021
    URI               /log/ingest
    Format            json
    Json_date_key     timestamp
    Json_date_format  iso8601
