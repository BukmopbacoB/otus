name: elk-vector

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped
    networks:
      - cms-shared-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.4
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    restart: unless-stopped
    networks:
      - cms-shared-net

  heartbeat:
    image: docker.elastic.co/beats/heartbeat:8.19.4
    user: root
    command: ["heartbeat", "-e", "--strict.perms=false"]
    depends_on:
      - elasticsearch
      - kibana
    environment:
      ELASTIC_HOSTS: http://elasticsearch:9200
      ELASTIC_USERNAME: elastic
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_HOST: http://kibana:5601
    volumes:
      - ./beats/heartbeat/heartbeat.yml:/usr/share/heartbeat/heartbeat.yml:ro
    restart: unless-stopped
    networks:
      - cms-shared-net

  vector:
    image: timberio/vector:0.43.1-alpine
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    depends_on:
      - elasticsearch
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./logs/nginx:/logs/nginx:ro
      - ./logs/php-fpm:/logs/php-fpm:ro
      - ./logs/postgresql:/logs/postgresql:ro
      - vector_data:/var/lib/vector
    restart: unless-stopped
    networks:
      - cms-shared-net

networks:
  cms-shared-net:
    external: true

volumes:
  esdata:
  vector_data:
