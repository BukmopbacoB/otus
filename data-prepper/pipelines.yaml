graylog-demo-pipeline:
  source:
    http:
      path: "/logs"

  processor:
    - parse_json: {}

    - date:
        from_time_received: true
        destination: "@timestamp"

    - delete_entries:
        with_keys:
          - "headers"
          - "request_path"

  sink:
    - opensearch:
        hosts: ["http://opensearch:9200"]
        index: "dataprepper-demo-%{yyyy.MM.dd}"
