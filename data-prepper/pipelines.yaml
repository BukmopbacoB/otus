log-pipeline:
  source:
    http:
      path: "/log/ingest"
      port: 2021
      max_request_length: "100mb"
  processor:
    - grok:
        match:
          log: [ "%{COMBINEDAPACHELOG}" ]
    - date:
        from_time_received: true
        destination: "@timestamp"
    - delete_entries:
        with_keys: ["message"]
  sink:
    - opensearch:
        hosts: [ "https://opensearch:9200" ]
        username: "admin"
        password: "Opensearch_2026_Strong!"
        index: "logs-%{yyyy.MM.dd}"
        insecure: true
